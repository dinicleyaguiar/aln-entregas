name: aln-entregas-prod

services:
  app:
    container_name: aln-entregas-prod

    build:
      context: .
      dockerfile: Dockerfile.prod

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DB_PATH: ${DB_PATH:-data/aln-entregas.db}

    ports:
      - "${APP_PORT:-3000}:3000"

    volumes:
      - ./data:/app/data
      - ./backups:/app/backups

    init: true
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
